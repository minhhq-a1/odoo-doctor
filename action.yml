name: "odoo-doctor"
description: "Unified health scoring for Odoo custom addons."
inputs:
  odoo-version:
    description: "Target Odoo version"
    required: false
  fail-on:
    description: "Fail if severity found (error|warning)"
    required: false
    default: "error"
  min-score:
    description: "Exit 2 if any module scores below this (0-100)"
    required: false
    default: "0"
  paths:
    description: "Path to scan"
    required: false
    default: "."
  diff-base:
    description: "Only scan files changed vs this branch"
    required: false
    default: "${{ github.event.pull_request.base.ref }}"
  advisory:
    description: "Run in advisory mode (surface findings but do not fail)"
    required: false
    default: "false"
  pr-comment:
    description: "Post a sticky PR comment with the results"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        
    - name: Install odoo-doctor
      shell: bash
      run: pip install "${{ github.action_path }}"
        
    - name: Run odoo-doctor
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # inputs reach the script as environment variables, never spliced into shell text
        INPUT_ODOO_VERSION: ${{ inputs.odoo-version }}
        INPUT_ADVISORY: ${{ inputs.advisory }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
        INPUT_PATHS: ${{ inputs.paths }}
      run: |
        ARGS=()
        if [ "$INPUT_ODOO_VERSION" != "" ]; then
          ARGS+=(--odoo-version "$INPUT_ODOO_VERSION")
        fi
        if [ "$INPUT_ADVISORY" != "true" ] && [ "$INPUT_FAIL_ON" != "" ]; then
          ARGS+=(--fail-on "$INPUT_FAIL_ON")
        fi
        if [ "$INPUT_ADVISORY" != "true" ] && [ "$INPUT_MIN_SCORE" != "" ]; then
          ARGS+=(--min-score "$INPUT_MIN_SCORE")
        fi
        DIFF_BASE="$INPUT_DIFF_BASE"
        if [ "$DIFF_BASE" != "" ]; then
          if git show-ref --verify --quiet "refs/remotes/origin/$DIFF_BASE"; then
            DIFF_BASE="origin/$DIFF_BASE"
          fi
          ARGS+=(--diff "$DIFF_BASE")
        fi
        if [ "$INPUT_PR_COMMENT" == "true" ] && [ "$DIFF_BASE" != "" ]; then
          ARGS+=(--score-delta "$DIFF_BASE")
        fi
        if [ "$INPUT_PR_COMMENT" != "true" ]; then
          ARGS+=(--no-pr-comment)
        fi

        odoo-doctor scan "$INPUT_PATHS" --format github "${ARGS[@]}"
