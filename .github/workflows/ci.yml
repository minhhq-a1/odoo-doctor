name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "ruff>=0.16,<0.17"

      - name: Run tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest

      - name: Run ruff
        run: python -m ruff check src tests scripts

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

  # The declared lower bounds are a promise; install exactly those (direct dependencies and
  # the dev extra) on the oldest Python to keep them honest.
  lowest-versions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install the lowest supported dependency versions
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Run tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest

  vscode-extension:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx vsce package --out odoo-doctor.vsix

  # The language server turns file URIs into paths and back; Windows (drive letters,
  # backslashes, case-insensitive paths) is where that differs from Linux and macOS.
  lsp-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run language server tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests/lsp tests/test_vscode_extension.py
