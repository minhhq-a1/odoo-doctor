name: Publish to PyPI

on:
  release:
    types: [published]
  # Run it from a tag (Use workflow from: the tag), never from a branch: the version check below
  # rejects any ref that is not a vX.Y.Z tag.
  workflow_dispatch:

jobs:
  check-version:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Compare the tag with pyproject.toml and odoo_doctor.__version__
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"

  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "ruff>=0.16,<0.17"

      - name: Run tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest

      - name: Run ruff
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Build source and wheel distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: Install the built wheel and scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl

      - name: Check the version and scan a tiny addon
        run: |
          smoke="$RUNNER_TEMP/smoke/bin/odoo-doctor"
          "$smoke" --version
          mkdir -p "$RUNNER_TEMP/addons/smoke_mod/models"
          cd "$RUNNER_TEMP/addons"
          echo '{"name": "Smoke", "version": "17.0.1.0.0", "depends": ["base"], "data": [], "license": "LGPL-3"}' > smoke_mod/__manifest__.py
          echo 'from . import models' > smoke_mod/__init__.py
          echo 'from . import smoke' > smoke_mod/models/__init__.py
          printf 'from odoo import models\n\n\nclass Smoke(models.Model):\n    _name = "smoke.model"\n\n    def run(self, expr):\n        return eval(expr)\n' > smoke_mod/models/smoke.py
          "$smoke" scan . --json > report.json
          grep -q '"eval-usage"' report.json

  pypi-publish:
    name: Publish to PyPI
    needs: [check-version, test, build, smoke-test]
    runs-on: ubuntu-latest

    # Define an environment for PyPI (optional but recommended for security)
    environment:
      name: pypi
      url: https://pypi.org/p/odoo-doctor

    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
